# ─────────────────────────────────────────────
# JRE TrainSim Auto-Pilot – Configuration
# ─────────────────────────────────────────────

# Global hotkeys (work even when game window is focused)
hotkeys:
  start: ","    # press comma to begin auto-pilot
  stop:  "."    # press period to stop

# "1handle" (E233 etc.) or "2handle" (KiHa 110, 185 etc.)
train_type: "1handle"

# ── Driving logic ──────────────────────────────
control:
  target_speed_margin_kmh: 0    # cruise ±3 km/h around speed limit
  stop_distance_m:         450  # begin final braking this far from segment end
  idle_speed_kmh:          0    # regarded as stopped below this speed
  loop_hz:                 5   # OCR + control cycles per second

# ── Key bindings (1-handle car, e.g. E233) ────
keys_1handle:
  brake_more: "q"
  neutral:    "s"
  power_more: "z"

# ── Key bindings (2-handle car, e.g. KiHa 110) ─
keys_2handle:
  brake_more: ","
  brake_less: "."
  brake_zero: "m"
  power_more: "z"
  power_less: "a"
  power_zero: "s"
# ── Logging ─────────────────────────────────────
logging:
  level: "DEBUG"   # DEBUG | INFO | WARNING | ERROR
  file_enabled: false
  file_path: "jre.log"

# Comfortable cruise notch selection.
# These rules are bypassed during platform-stop approach.
# Positive speed error means current speed is below target: CUT/P1-P5.
# Negative speed error means current speed is above target: SUPPRESS/B1-B7.
# Emergency braking is intentionally not used; any EMG value is clamped to B7.
comfort_control:
  deadband_kmh: 1.0       # within 1 km/h: CUT when slow, SUPPRESS when fast
  max_notch_step: 1       # move only this many notches per control tick
  key_press_seconds: 0.01 # short keyboard tap duration for each handle step
  key_settle_seconds: 0.04 # wait after each tap for game memory to catch up
  key_cooldown_seconds: 0.25 # wait before sending another handle key
  stop_planning_brake: 4  # plan station stops around this service brake notch
  stop_safety: 0.85       # lower = earlier/gentler stop braking

  power_rules:
    - { diff_kmh: 1,   gear: "CUT" }
    - { diff_kmh: 3,   gear: "P1" }
    - { diff_kmh: 6,   gear: "P2" }
    - { diff_kmh: 10,  gear: "P3" }
    - { diff_kmh: 15,  gear: "P4" }
    - { diff_kmh: 999, gear: "P5" }

  brake_rules:
    - { diff_kmh: 1,   gear: "SUPPRESS" }
    - { diff_kmh: 3,   gear: "B1" }
    - { diff_kmh: 6,   gear: "B2" }
    - { diff_kmh: 9,   gear: "B3" }
    - { diff_kmh: 12,  gear: "B4" }
    - { diff_kmh: 15,  gear: "B5" }
    - { diff_kmh: 19,  gear: "B6" }
    - { diff_kmh: 999, gear: "B7" }
